# Included in every location: nginx drops server-level add_header lines in
# any location that sets its own headers.
# The JWT lives in localStorage, so a strict CSP is the main defence
# against injected scripts reading it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
